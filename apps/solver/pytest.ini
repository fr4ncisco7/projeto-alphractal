[pytest]
testpaths = tests
# tests/ entra no sys.path para os testes importarem sintetico.py; o conftest
# cuida de por o diretorio do solver junto, que e' de onde main/otimizador vem.
pythonpath = . tests
filterwarnings =
    # statsmodels chama o otimizador do scipy com passo que as vezes gera NaN
    # numa diferenca finita; converge normalmente. Barulho conhecido.
    ignore:invalid value encountered in subtract:RuntimeWarning
    # StarletteDeprecationWarning herda de UserWarning, nao de DeprecationWarning.
    ignore:Using .httpx. with .starlette.testclient.:UserWarning
