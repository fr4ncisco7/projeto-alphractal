services:
  db:
    # Sobe sozinho depois de reboot ou reinício do Docker. Sem isto, a
    # ingestão morre em silêncio a cada vez que a máquina reinicia.
    restart: unless-stopped
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  solver-python:
    # Sobe sozinho depois de reboot ou reinício do Docker. Sem isto, a
    # ingestão morre em silêncio a cada vez que a máquina reinicia.
    restart: unless-stopped
    build: ./apps/solver
    # Sem isto o container roda como root e tudo que ele escreve no diretório
    # montado (ex: __pycache__) vira arquivo root na máquina do dev, que não
    # consegue nem apagar sem sudo.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/solver:/app
    # A imagem roda sem --reload (e' o comando de producao). Aqui em dev o
    # bind mount acima torna o reload util, entao sobrescrevemos.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  backend-node:
    # Sobe sozinho depois de reboot ou reinício do Docker. Sem isto, a
    # ingestão morre em silêncio a cada vez que a máquina reinicia.
    restart: unless-stopped
    build: ./apps/backend-node
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend-node/src:/app/src
    environment:
      SOLVER_URL: http://solver-python:8000
      DATABASE_URL: ${DATABASE_URL}
      RPC_HTTP_URL: ${RPC_HTTP_URL}
      RPC_WS_URL: ${RPC_WS_URL}
      INGESTAO_ATIVA: ${INGESTAO_ATIVA:-true}
    depends_on:
      db:
        condition: service_healthy
      solver-python:
        condition: service_started

volumes:
  db-data:
